services:
  mongo:
    image: mongo:7
    container_name: entropy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - entropy-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: entropy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - entropy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: entropy-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/entropy_oj
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-entropy_prod_secret_f93a1c2e8b7d4e5f6a0c1b2d3e4f5a6b}
      - JWT_EXPIRES_DAYS=7
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-AdminSecure2026!}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - entropy-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: entropy-worker
    restart: unless-stopped
    volumes:
      - /tmp/workspaces:/tmp/workspaces
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/entropy_oj
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONCURRENCY=2
      - WORKSPACES_DIR=/tmp/workspaces
      - RUNNER_SCRIPT_PATH=/usr/local/bin/runner_process.sh
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - entropy-network

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: entropy-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - server
    networks:
      - entropy-network

volumes:
  mongo_data:
  redis_data:

networks:
  entropy-network:
    driver: bridge
