version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: oj-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - oj-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oj-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: oj-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/anti_oj
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key_anti_online_judge_2026_production_grade
      - JWT_EXPIRES_DAYS=7
      - CLIENT_URL=http://localhost
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oj-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: oj-worker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/anti_oj
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUNNER_IMAGE=oj-runner:latest
      - WORKER_CONCURRENCY=2
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_started
    networks:
      - oj-network

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: oj-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - oj-network

volumes:
  mongo_data:
  redis_data:

networks:
  oj-network:
    driver: bridge
