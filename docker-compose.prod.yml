# ============================================================
#  Entropy Online Judge — Production Docker Compose (Azure VM)
#
#  This runs ONLY on the Azure VM.
#  It orchestrates: Redis 7 + apps/worker (BullMQ consumer + Direct Process sandbox)
#
#  Usage:
#    1. Copy .env.production to the VM and rename to .env
#    2. Start: docker compose -f docker-compose.prod.yml up -d --build
#    3. Logs:  docker compose -f docker-compose.prod.yml logs -f
#
#  NOTE: No separate runner image build step needed!
#  The worker image now includes the compiler toolchain (g++, python3) directly.
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: entropy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - entropy-prod

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: entropy-worker
    restart: unless-stopped
    volumes:
      # Shared workspace directory for sandbox I/O (no Docker socket needed!)
      - /tmp/workspaces:/tmp/workspaces
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - DOCKER_TIMEOUT_SEC=${DOCKER_TIMEOUT_SEC:-15}
      - WORKER_HEALTH_PORT=5001
      - WORKSPACES_DIR=/tmp/workspaces
      - RUNNER_SCRIPT_PATH=/usr/local/bin/runner_process.sh
    ports:
      - "5001:5001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - entropy-prod

volumes:
  redis_data:

networks:
  entropy-prod:
    driver: bridge
